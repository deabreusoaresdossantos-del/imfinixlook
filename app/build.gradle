plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.imfinix.look'
    compileSdk 34

    defaultConfig {
        applicationId "com.imfinix.look"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
